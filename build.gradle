plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets {
    // Keep GameTests in a separate fixture source set so the dev run can discover
    // them without including test-only classes or resources in the standard jar.
    gametest
}

// The focused camera-tour namespace is also the GameTest template namespace.
// Mirror only these fixture structures there so namespace-filtered runs resolve them.
def cameraTourTemplateResources = layout.buildDirectory.dir('generated/gametest-camera-tour-resources')
sourceSets.gametest.resources.srcDir(cameraTourTemplateResources)
def generateCameraTourTemplateResources = tasks.register('generateCameraTourTemplateResources', Copy) {
    from('src/gametest/resources/data/moonstation14/structure') {
        include 'disposal_clear.nbt', 'disposal_power_clear.nbt'
        into 'data/moonstation14_camera_tour/structure'
    }
    into cameraTourTemplateResources
}
tasks.named('processGametestResources') {
    dependsOn generateCameraTourTemplateResources
}
tasks.named('processTestResources') {
    dependsOn generateCameraTourTemplateResources
}

sourceSets.test.resources.srcDir sourceSets.gametest.resources

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'RyanHcode'
        url = 'https://maven.ryanhcode.dev/releases'
        content {
            includeGroup 'dev.ryanhcode.sable-companion'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Make the main mod available to the dedicated GameTest fixture in dev runs.
    addModdingDependenciesTo sourceSets.gametest

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Optional connected-smoke isolation. Defaults retain the normal ModDev run directory.
            if (project.hasProperty('ms14ClientRunDir')) {
                gameDirectory = project.file(project.property('ms14ClientRunDir'))
            }
            if (project.hasProperty('ms14DebugLoadCargoPacketTarget')) {
                systemProperty 'ms14.debug.loadCargoPacketTarget', project.property('ms14DebugLoadCargoPacketTarget').toString()
            }
            if (project.hasProperty('ms14MixinDebugExport')) {
                systemProperty 'mixin.debug.export', project.property('ms14MixinDebugExport').toString()
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client2 {
            client()
            programArguments.addAll('--username', 'TestPlayer2')
        }

        server {
            server()
            // Optional connected-smoke isolation. Defaults retain the normal ModDev run directory.
            if (project.hasProperty('ms14ServerRunDir')) {
                gameDirectory = project.file(project.property('ms14ServerRunDir'))
            }
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            // Load the fixture-only progress observer before mixin bootstrap begins.
            programArguments.addAll('--mixin', 'moonstation14.gametest.mixins.json')
            // Optional isolated directory for GameTests: -Pms14GameTestDir=build/gametest-run
            if (project.hasProperty('ms14GameTestDir')) {
                gameDirectory = project.file(project.property('ms14GameTestDir'))
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', project.findProperty('ms14GameTestNamespaces') ?: "${project.mod_id},moonstation14_camera_tour"
            if (project.hasProperty('ms14GameTestTags')) {
                systemProperty 'moonstation14.gameTestTags', project.property('ms14GameTestTags').toString()
            }
            if (project.hasProperty('ms14HullImpactExpectedSubsteps')) {
                systemProperty 'moonstation14.hullImpactExpectedSubsteps',
                        project.property('ms14HullImpactExpectedSubsteps').toString()
            }
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // Bind the fixture as well so GameTests remain discoverable in dev,
            // while the standard jar continues to package only the main source set.
            sourceSet(sourceSets.gametest)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly, localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Sable is mandatory; candidate selection is explicit validation-only. The default remains
    // the pinned official release and never resolves both outer JARs into the classpath.
    def nativeCandidateProperty = providers.gradleProperty('ms14SableNativeCandidate').orNull
    if (nativeCandidateProperty == null) {
        implementation('maven.modrinth:sable:fg9dTRz9') { transitive = false }
    } else {
        if (!System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ||
                !System.getProperty('os.arch').toLowerCase(Locale.ROOT).contains('amd64') &&
                !System.getProperty('os.arch').toLowerCase(Locale.ROOT).contains('x86_64')) {
            throw new GradleException('ms14SableNativeCandidate is supported only on a Windows AMD64 host')
        }
        def candidate = file(nativeCandidateProperty)
        def provenance = new File(candidate.parentFile, candidate.name.replaceFirst(/\.jar$/, '.provenance.json'))
        if (!candidate.isFile() || !provenance.isFile()) {
            throw new GradleException("Native candidate and paired provenance must already exist: ${candidate} / ${provenance}; run managed packaging first")
        }
        def json = new groovy.json.JsonSlurper().parse(provenance)
        def sha256 = { File f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
        def official = new groovy.json.JsonSlurper().parse(file('tooling/native-physics/official-artifact.json'))
        def sable = new groovy.json.JsonSlurper().parse(file('tooling/native-physics/sable-source.json'))
        def rapier = new groovy.json.JsonSlurper().parse(file('tooling/native-physics/rapier-source.json'))
        def invalid = !json || json.outer_jar_sha256 != sha256(candidate) ||
                json.official_outer_jar_sha256 != official.sha256 ||
                json.target_native != 'sable_rapier_x86_64_windows.dll' ||
                json.scope != 'Windows x64 only; other five official native payloads unchanged' ||
                json.sable_source?.commit != sable.commit || json.sable_source?.patchSha256 != sable.patchSha256 ||
                json.sable_source?.patchedSha256 != sable.patchedSha256 ||
                json.rapier_source?.revision != rapier.revision || json.rapier_source?.patch_sha256 != rapier.patch_sha256 ||
                json.rapier_source?.patched_source_sha256 != rapier.patched_source_sha256
        if (invalid) throw new GradleException("Native candidate provenance/hash/source bindings are invalid: ${provenance}")
        logger.lifecycle("Using opt-in Sable native candidate ${candidate.name} sha256=${sha256(candidate)} (validation only)")
        implementation files(candidate)
    }
    // Sable exposes Pose3d in its required allocation API; the release embeds this exact MIT API jar.
    compileOnly 'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'
    // The framed-outline geometry unit test calls the production Pose3dc helper directly.
    testImplementation 'dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0'

    gametestImplementation sourceSets.main.output
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation sourceSets.gametest.output
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

test {
    useJUnitPlatform()
    systemProperty 'moonstation14.projectDir', projectDir.toString()
    systemProperty 'moonstation14.gametestClasses', sourceSets.gametest.output.classesDirs.singleFile.toString()
    classpath += sourceSets.gametest.output
}

if (project.hasProperty('ms14GameTestTags')) {
    def gameTestTagPreflight = tasks.register('gameTestTagPreflight', JavaExec) {
        dependsOn tasks.named('compileGametestJava')
        classpath = sourceSets.gametest.runtimeClasspath
        mainClass = 'com.juicyslew.moonstation14.gametest.support.GameTestTagPreflight'
        args sourceSets.gametest.output.classesDirs.singleFile.absolutePath, project.property('ms14GameTestTags').toString()
    }
    tasks.named('runGameTestServer').configure {
        dependsOn gameTestTagPreflight
    }
}

neoForge {
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Only the dedicated development server needs this guard. A separate task lets us
// exercise the same check without launching Minecraft or editing run/server.properties.
class DevServerPortPreflight {
static void check(File propertiesFile) {
    def properties = new Properties()
    if (propertiesFile.exists() && !propertiesFile.isFile()) {
        throw new GradleException("Server properties path is not a file: ${propertiesFile}")
    }
    if (propertiesFile.isFile()) {
        propertiesFile.withInputStream { properties.load(it) }
    }

    def portText = properties.getProperty('server-port', '25565').trim()
    if (!(portText ==~ /[0-9]+/) || portText.length() > 5) {
        throw new GradleException("Invalid server-port '${portText}' in ${propertiesFile}; expected 1..65535")
    }
    int port = Integer.parseInt(portText)
    if (port < 1 || port > 65535) {
        throw new GradleException("Invalid server-port '${portText}' in ${propertiesFile}; expected 1..65535")
    }

    def host = properties.getProperty('server-ip', '').trim()
    def address
    try {
        // An empty server-ip means the same wildcard address Minecraft binds.
        address = host ? new java.net.InetSocketAddress(java.net.InetAddress.getByName(host), port)
                       : new java.net.InetSocketAddress(port)
    } catch (Exception e) {
        throw new GradleException("Invalid server-ip '${host}' in ${propertiesFile}", e)
    }

    try {
        // A real TCP bind tests the OS's effective IPv4/IPv6 and wildcard conflicts,
        // rather than relying on a potentially incomplete process listing.
        new java.net.ServerSocket().withCloseable { socket ->
            socket.setReuseAddress(false)
            socket.bind(address)
        }
    } catch (java.io.IOException e) {
        def owner = 'PID/listener details unavailable'
        if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            try {
                // Only a validated numeric port is inserted; no properties text reaches the shell.
                // Never output command-line arguments: they may contain credentials.
                // Only extract the fixed-format worktree name, if present.
                def script = '''$ProgressPreference = 'SilentlyContinue'; Get-NetTCPConnection -State Listen -LocalPort __PORT__ -ErrorAction SilentlyContinue | Select-Object -First 8 | ForEach-Object { $pidText = [string]$_.OwningProcess; $address = [string]$_.LocalAddress; if ($pidText -notmatch '^[0-9]{1,20}$' -or $address -notmatch '^[a-zA-Z0-9:.%_-]{1,80}$') { return }; $command = (Get-CimInstance Win32_Process -Filter ('ProcessId = ' + $pidText) -ErrorAction SilentlyContinue).CommandLine; $worktree = ''; if ($command -match '(?i)MoonStation14-agent-[0-9]{2}(?![a-zA-Z0-9_-])') { $worktree = $Matches[0] }; 'PID=' + $pidText + ' address=' + $address + $(if ($worktree) { ' worktree=' + $worktree } else { '' }) }'''.replace('__PORT__', port.toString())
                def encoded = Base64.encoder.encodeToString(script.getBytes('UTF-16LE'))
                def process = new ProcessBuilder('powershell.exe', '-NoProfile', '-NonInteractive', '-EncodedCommand', encoded)
                        .redirectError(ProcessBuilder.Redirect.DISCARD).start()
                def completed = process.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)
                if (completed && process.exitValue() == 0) {
                    def output = new String(process.inputStream.readNBytes(2048), java.nio.charset.StandardCharsets.UTF_8)
                    def listeners = output.readLines().findAll {
                        it ==~ /PID=[0-9]{1,20} address=[a-zA-Z0-9:.%_-]{1,80}( worktree=(?i:MoonStation14-agent-[0-9]{2}))?/
                    }.take(8)
                    if (listeners) owner = listeners.join('\n')
                } else {
                    owner = completed ? 'PID/listener details unavailable (Windows diagnostic failed)' : 'PID/listener details unavailable (Windows diagnostic timed out)'
                }
            } catch (Exception diagnosticError) {
                owner = 'PID/listener details unavailable (Windows diagnostic failed)'
                // The socket bind result is authoritative even if diagnostics are denied.
            }
        }
        throw new GradleException("Development server TCP port ${port} (${host ?: 'all interfaces'}) cannot be bound: ${e.message}\nListening process: ${owner}\nNo process was stopped and no alternate port was selected.", e)
    }
    println "Development server TCP port ${port} (${host ?: 'all interfaces'}) is available (preflight only)."
}
}

abstract class DevServerPortCheckTask extends DefaultTask {
    @org.gradle.api.tasks.Input
    abstract org.gradle.api.provider.Property<String> getPropertiesPath()

    @org.gradle.api.tasks.TaskAction
    void check() {
        DevServerPortPreflight.check(new File(propertiesPath.get()))
    }
}

tasks.register('preflightServerPort', DevServerPortCheckTask) {
    group = 'verification'
    description = 'Checks the dev server TCP bind without launching Minecraft; optional -Pms14PreflightProperties=<file> for isolated tests.'
    propertiesPath = project.file(providers.gradleProperty('ms14PreflightProperties').orElse('run/server.properties').get()).absolutePath
}

abstract class StageSableConfigTask extends DefaultTask {
    @org.gradle.api.tasks.InputFile
    @org.gradle.api.tasks.PathSensitive(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    abstract org.gradle.api.file.RegularFileProperty getTemplateFile()

    @org.gradle.api.tasks.Internal
    abstract org.gradle.api.file.RegularFileProperty getConfigFile()

    @org.gradle.api.tasks.Input
    abstract org.gradle.api.provider.Property<Integer> getSubsteps()

    @org.gradle.api.tasks.TaskAction
    void stage() {
        File sableConfigFile = configFile.get().asFile
        Integer targetSubsteps = substeps.get()
        File template = templateFile.get().asFile
        // Set only the approved root key. Keep every other existing setting and byte intact.
        if (!sableConfigFile.exists()) {
            sableConfigFile.parentFile.mkdirs()
            java.nio.file.Files.copy(template.toPath(), sableConfigFile.toPath())
            def seed = sableConfigFile.getText('UTF-8').replaceFirst(/(?m)^(\s*sub_level_substeps_per_tick\s*=\s*)[+-]?\d+/, '$1' + targetSubsteps)
            sableConfigFile.setText(seed, 'UTF-8')
            logger.lifecycle("Created ${sableConfigFile} with Sable substeps=${targetSubsteps}.")
        } else {
            def original = sableConfigFile.getText('UTF-8')
            def lines = original.split('(?<=\\n)', -1)
            def rootTableSeen = false
            def keyFound = false
            def updated = new StringBuilder()
            lines.each { line ->
                def trimmedLine = line.trim().replaceFirst(/^\uFEFF/, '')
                if (trimmedLine.startsWith('[') && trimmedLine.contains(']')) rootTableSeen = true
                if (!rootTableSeen && trimmedLine.startsWith('sub_level_substeps_per_tick')) {
                    // Replace only the scalar, retaining whitespace, line ending, and inline comment.
                    line = line.replaceFirst(/(sub_level_substeps_per_tick\s*=\s*)[+-]?\d+/, '$1' + targetSubsteps)
                    keyFound = true
                }
                updated.append(line)
            }
            if (!keyFound) {
                def text = updated.toString()
                def tableOffset = -1
                def offset = 0
                text.split('(?<=\\n)', -1).each { line ->
                    def trimmedLine = line.trim().replaceFirst(/^\uFEFF/, '')
                    if (tableOffset < 0 && trimmedLine.startsWith('[') && trimmedLine.contains(']'))
                        tableOffset = offset
                    offset += line.length()
                }
                if (tableOffset >= 0) {
                    updated.insert(tableOffset, "sub_level_substeps_per_tick = ${targetSubsteps}\n")
                } else {
                    if (text && !text.endsWith('\n')) updated.append('\n')
                    updated.append("sub_level_substeps_per_tick = ${targetSubsteps}\n")
                }
            }
            if (updated.toString() != original) {
                sableConfigFile.setText(updated.toString(), 'UTF-8')
                logger.lifecycle("Set sub_level_substeps_per_tick=${targetSubsteps} in ${sableConfigFile}; other Sable settings were preserved.")
            } else {
                logger.lifecycle("Sable sublevel physics already uses ${targetSubsteps} substeps: ${sableConfigFile}")
            }
        }
}
}
def selectedServerRunDir = providers.gradleProperty('ms14ServerRunDir').orElse('run')
def sableConfigTemplate = project.file('config/sable-server.toml')
tasks.register('stageSableServerConfig', StageSableConfigTask) {
    group = 'server'
    description = 'Ensures the selected server directory uses six Sable sublevel physics substeps.'
    configFile = project.file("${selectedServerRunDir.get()}/config/sable-server.toml")
    templateFile = sableConfigTemplate
    substeps = 6
}
def hasExplicitGameTestSubsteps = project.hasProperty('ms14GameTestSableSubsteps')
if (hasExplicitGameTestSubsteps && !project.hasProperty('ms14GameTestDir')) {
    throw new GradleException('-Pms14GameTestDir=<fresh-dir> is required with -Pms14GameTestSableSubsteps.')
}
if (project.hasProperty('ms14GameTestDir')) {
    def gameTestDir = project.file(project.property('ms14GameTestDir'))
    def canonicalBuildDir = layout.buildDirectory.get().asFile.canonicalFile.toPath()
    def canonicalGameTestDir = gameTestDir.canonicalFile.toPath()
    // Only auto-stage for isolated directories under this checkout's build output.
    // External profiles are left untouched unless the substep override is explicit.
    def isManagedBuildDir = canonicalGameTestDir.startsWith(canonicalBuildDir)
    if (hasExplicitGameTestSubsteps || isManagedBuildDir) {
        def testSubsteps = 6
        if (hasExplicitGameTestSubsteps) {
            def rawSubsteps = project.property('ms14GameTestSableSubsteps').toString()
            if (!(rawSubsteps ==~ /[1-9][0-9]*/)) throw new GradleException('ms14GameTestSableSubsteps must be a positive integer.')
            testSubsteps = rawSubsteps.toInteger()
        }
    tasks.register('stageSableGameTestConfig', StageSableConfigTask) {
        group = 'verification'
        description = 'Stages Sable substeps for an isolated GameTest run.'
        configFile = new File(gameTestDir, 'config/sable-server.toml')
        templateFile = sableConfigTemplate
        substeps = testSubsteps
    }
    tasks.named('runGameTestServer') { dependsOn 'stageSableGameTestConfig' }
    }
}

tasks.named('runServer') {
    def runDir = selectedServerRunDir.get()
    def serverPropertiesFile = project.file("${runDir}/server.properties")
    dependsOn 'stageSableServerConfig'
    doFirst {
        // Inspect the same configured directory the dev server will use.
        DevServerPortPreflight.check(serverPropertiesFile)
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
